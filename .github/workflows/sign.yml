name: Notarized DMG

# Manual test build of the notarized DMG from main, without publishing a release.
# Version `<MARKETING_VERSION>-dev.<run>`; the DMG is kept as a workflow artifact
# for 7 days. Releases use release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 10
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          current=$(swift Tools/ReleaseVersion.swift current)
          echo "marketing_version=$current" >> "$GITHUB_OUTPUT"
          echo "label=$current-dev.$RUN_NUMBER" >> "$GITHUB_OUTPUT"

  sign:
    needs: version
    uses: ./.github/workflows/build-dmg.yml
    with:
      marketing_version: ${{ needs.version.outputs.marketing_version }}
      build_number: ${{ github.run_number }}
      version_label: ${{ needs.version.outputs.label }}
      artifact_name: MatterMac-dmg
    secrets: inherit
